name: reusable-container-supply-chain

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
      registry:
        required: false
        type: string
        default: ghcr.io
      enable-signing:
        description: Push and keylessly sign when registry credentials are supplied
        required: false
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to registry
        if: ${{ inputs.enable-signing }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Define image reference
        id: image
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          image_name="${IMAGE_NAME,,}"
          echo "ref=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${image_name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.enable-signing }}
          load: true
          tags: ${{ steps.image.outputs.ref }}

      - name: SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # Node 24, Syft v1.42.3
        with:
          image: ${{ steps.image.outputs.ref }}
          artifact-name: sbom-${{ github.event.repository.name }}.spdx.json

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.image.outputs.ref }}
          ignore-unfixed: true
          format: table
          exit-code: "1"
          vuln-type: "os,library"

      - name: Install Cosign
        if: ${{ inputs.enable-signing }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign sign and verify (keyless)
        if: ${{ inputs.enable-signing }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          image_ref="${{ steps.image.outputs.ref }}"
          cosign sign --yes "$image_ref"
          cosign verify "$image_ref" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}"
