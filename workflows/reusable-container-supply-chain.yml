name: reusable-container-supply-chain

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
      registry:
        required: false
        type: string
        default: ghcr.io
      enable-signing:
        required: false
        type: boolean
        default: true
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to registry
        if: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ inputs.registry }}/${{ github.repository }}:${{ github.sha }}

      - name: SBOM (syft)
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ inputs.registry }}/${{ github.repository }}:${{ github.sha }}
          artifact-name: sbom-${{ github.event.repository.name }}.spdx.json

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ github.repository }}:${{ github.sha }}
          ignore-unfixed: true
          format: table
          exit-code: "1"
          vuln-type: "os,library"

      - name: Install Cosign
        if: ${{ inputs.enable-signing }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign sign (keyless)
        if: ${{ inputs.enable-signing }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ inputs.registry }}/${{ github.repository }}:${{ github.sha }}

      - name: Cosign verify (keyless)
        if: ${{ inputs.enable-signing }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign verify ${{ inputs.registry }}/${{ github.repository }}:${{ github.sha }} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp "https://github.com/${{ github.repository }}"
