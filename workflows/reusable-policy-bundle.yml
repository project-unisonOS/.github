name: reusable-policy-bundle

on:
  workflow_call:
    inputs:
      policy-dir:
        type: string
        required: false
        default: policies
      bundle-out:
        type: string
        required: false
        default: bundle.tar.gz

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build-policy-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x ./opa
          sudo mv ./opa /usr/local/bin/opa

      - name: Validate policies
        run: |
          opa fmt --fail "${{ inputs.policy-dir }}" 2>/dev/null || true
          opa test "${{ inputs.policy-dir }}"

      - name: Build bundle
        run: |
          opa build --bundle ${{ inputs.policy-dir }} -o ${{ inputs.bundle-out }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.bundle-out }}
          path: ${{ inputs.bundle-out }}
